allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

// AGP 8 requires every module to declare a namespace. Several plugins this
// app depends on (e.g. flutter_keyboard_visibility 5.x) predate that, so
// backfill the namespace from each library's manifest package attribute.
def backfillNamespace = { project ->
    if (project.plugins.hasPlugin("com.android.library") ||
        project.plugins.hasPlugin("com.android.application")) {
        def androidExt = project.extensions.findByName("android")
        if (androidExt != null && androidExt.namespace == null) {
            def manifest = project.file("src/main/AndroidManifest.xml")
            if (manifest.exists()) {
                def parsed = new groovy.xml.XmlSlurper().parse(manifest)
                def pkg = parsed.@package.text()
                if (pkg) {
                    androidExt.namespace = pkg
                }
            }
        }
    }
}
subprojects { project ->
    // evaluationDependsOn(':app') above may have evaluated a project already;
    // afterEvaluate would then throw, so apply directly in that case.
    if (project.state.executed) {
        backfillNamespace(project)
    } else {
        project.afterEvaluate { backfillNamespace(project) }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
